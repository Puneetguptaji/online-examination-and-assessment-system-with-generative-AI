{% extends 'base.html' %}{% block title %}Edit question · ExamAI{% endblock %}
{% block content %}<section class="page-heading"><div><div class="eyebrow"><a href="{{ url_for('teacher_questions',exam_id=q.exam_id) }}">QUESTION BANK</a> / EDIT</div><h1>Edit question</h1><p>Changes are permitted only while this exam is an unused draft.</p></div></section><section class="card edit-form-card"><form method="post" class="stack-form"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>Question<textarea name="question_text" rows="3" required>{{ q.question_text }}</textarea></label><div class="option-fields">{% for letter in 'ABCD' %}<label><span>Option {{ letter }}</span><input name="option_{{ letter|lower }}" value="{{ q['option_'+letter|lower] }}" required></label>{% endfor %}</div><label>Correct option<select name="correct_option">{% for letter in 'ABCD' %}<option {% if letter==q.correct_option %}selected{% endif %}>{{ letter }}</option>{% endfor %}</select></label><label>Topic<input name="topic" value="{{ q.topic }}" maxlength="100"></label><label>Marks<input type="number" name="marks" value="{{ q.marks }}" min="1" max="100"></label><label>Explanation<textarea name="explanation" rows="3">{{ q.explanation or '' }}</textarea></label><div class="review-actions"><button class="button button-primary" type="submit">Save changes</button><a class="button" href="{{ url_for('teacher_questions',exam_id=q.exam_id) }}">Cancel</a></div></form></section>{% endblock %}
